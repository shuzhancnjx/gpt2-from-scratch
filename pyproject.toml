[project]
name = "gpt2"
version = "0.1.0"
description = "A small GPT: pretraining, inference, and fine-tuning, built from scratch."
requires-python = ">=3.12"
dependencies = [
    "torch",
    "numpy",
    "tiktoken",
]

[project.optional-dependencies]
# plotting and notebooks are not needed to train
viz = ["matplotlib", "ipykernel", "jupyterlab"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
